name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ios-ipa.yml'
      - '.npmrc'

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 📂 Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🚀 Expo Prebuild (Generate Native iOS Project)
        run: |
          pnpm --filter @corvus/mobile exec expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_API_URL: "https://aiic-bbs.vercel.app/api"
          EXPO_PUBLIC_SUPABASE_URL: "https://tgbjgyhcfhqvwayvvwkl.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnYmpneWhjZmhxdndheXZ2d2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTcwNjIsImV4cCI6MjEwMjI5MzA2Mn0.Cjj6oY9s7FwTywXlw-9h4Um01cBvfllKQqapobmYXNY"

      - name: 📦 Install CocoaPods
        run: |
          cd apps/mobile/ios
          pod install

      - name: 🍎 Build iOS Release Archive (Unsigned / Ad-Hoc Simulator & Generic Device)
        run: |
          cd apps/mobile/ios
          xcodebuild -workspace AIICClub.xcworkspace \
            -scheme AIICClub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AIICClub.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 📦 Package .xcarchive into .ipa
        run: |
          cd apps/mobile/ios
          mkdir -p Payload
          cp -r build/AIICClub.xcarchive/Products/Applications/AIICClub.app Payload/
          zip -r AIICClub-release.ipa Payload
          rm -rf Payload

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiic-club-release-ipa
          path: apps/mobile/ios/AIICClub-release.ipa
          if-no-files-found: error
