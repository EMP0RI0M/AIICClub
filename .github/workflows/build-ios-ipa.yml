name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ios-ipa.yml'
      - '.npmrc'

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🍎 Select Xcode 16.1+
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 📂 Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🚀 Expo Prebuild (Generate Native iOS Project)
        run: |
          pnpm --filter @corvus/mobile exec expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_API_URL: "https://aiic-bbs.vercel.app/api"
          EXPO_PUBLIC_SUPABASE_URL: "https://tgbjgyhcfhqvwayvvwkl.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnYmpneWhjZmhxdndheXZ2d2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTcwNjIsImV4cCI6MjEwMjI5MzA2Mn0.Cjj6oY9s7FwTywXlw-9h4Um01cBvfllKQqapobmYXNY"

      - name: 📦 Configure Podfile & Install CocoaPods
        run: |
          cd apps/mobile/ios
          # Inject Xcode 16 build settings into the existing post_install block generated by Expo
          ruby -e '
            content = File.read("Podfile")
            injection = %{
                installer.pods_project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings["CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES"] = "YES"
                    config.build_settings["GCC_WARN_64_TO_32_BIT_CONVERSION"] = "NO"
                    config.build_settings["ENABLE_USER_SCRIPT_SANDBOXING"] = "NO"
                    config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.1"
                  end
                end
            }
            if content.include?("post_install do |installer|")
              content.sub!("post_install do |installer|", "post_install do |installer|\n" + injection)
            else
              content += "\npost_install do |installer|\n" + injection + "\nend\n"
            end
            File.write("Podfile", content)
          '
          pod install

      - name: 🍎 Build iOS Release Archive (Unsigned / Ad-Hoc Simulator & Generic Device)
        run: |
          cd apps/mobile/ios
          xcodebuild -workspace AIICClub.xcworkspace \
            -scheme AIICClub \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/AIICClub.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: 📦 Package .xcarchive into .ipa
        run: |
          cd apps/mobile/ios
          mkdir -p Payload
          # Copy app bundle to Payload folder for IPA creation
          APP_DIR=$(find build/AIICClub.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -d "$APP_DIR" ]; then
            cp -r "$APP_DIR" Payload/
            zip -r AIICClub-release.ipa Payload
            rm -rf Payload
          else
            echo "App bundle not found in archive"
            exit 1
          fi

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiic-club-release-ipa
          path: apps/mobile/ios/AIICClub-release.ipa
          if-no-files-found: error
