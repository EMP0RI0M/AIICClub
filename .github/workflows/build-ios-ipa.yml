name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ios-ipa.yml'
      - '.npmrc'

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🍎 Select Xcode (16.0 / 15.4)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 📂 Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: 🚀 Expo Prebuild (Generate Native iOS Project)
        run: |
          pnpm --filter @corvus/mobile exec expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_API_URL: "https://aiic-bbs.vercel.app/api"
          EXPO_PUBLIC_SUPABASE_URL: "https://tgbjgyhcfhqvwayvvwkl.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnYmpneWhjZmhxdndheXZ2d2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTcwNjIsImV4cCI6MjEwMjI5MzA2Mn0.Cjj6oY9s7FwTywXlw-9h4Um01cBvfllKQqapobmYXNY"

      - name: 🔧 Patch Xcode Project Code Signing Configuration
        run: |
          cd apps/mobile/ios
          ruby -e '
            proj_path = "AIICClub.xcodeproj/project.pbxproj"
            if File.exist?(proj_path)
              content = File.read(proj_path)
              content.gsub!(/CODE_SIGN_STYLE = [^;]+;/, "CODE_SIGN_STYLE = Manual;")
              content.gsub!(/DEVELOPMENT_TEAM = [^;]+;/, "DEVELOPMENT_TEAM = \"\";")
              content.gsub!(/CODE_SIGN_IDENTITY = "[^"]*";/, "CODE_SIGN_IDENTITY = \"\";")
              content.gsub!(/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = "[^"]*";/, "CODE_SIGN_IDENTITY[sdk=iphoneos*] = \"\";")
              content.gsub!(/ENABLE_USER_SCRIPT_SANDBOXING = [^;]+;/, "ENABLE_USER_SCRIPT_SANDBOXING = NO;")
              File.write(proj_path, content)
              puts "Successfully patched AIICClub.xcodeproj project.pbxproj"
            end
          '

      - name: 📦 Configure Podfile & Install CocoaPods
        run: |
          cd apps/mobile/ios
          # Inject Xcode 16 build settings into the existing post_install block generated by Expo
          ruby -e '
            content = File.read("Podfile")
            injection = %{
                installer.pods_project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings["CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES"] = "YES"
                    config.build_settings["GCC_WARN_64_TO_32_BIT_CONVERSION"] = "NO"
                    config.build_settings["ENABLE_USER_SCRIPT_SANDBOXING"] = "NO"
                    config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.1"
                    config.build_settings["GCC_TREAT_WARNINGS_AS_ERRORS"] = "NO"
                    config.build_settings["SWIFT_TREAT_WARNINGS_AS_ERRORS"] = "NO"
                    config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
                    config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                    config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                  end
                end
            }
            if content.include?("post_install do |installer|")
              content.sub!("post_install do |installer|", "post_install do |installer|\n" + injection)
            else
              content += "\npost_install do |installer|\n" + injection + "\nend\n"
            end
            File.write("Podfile", content)
          '
          pod install

      - name: 🍎 Build iOS Release App Bundle (Unsigned / Ad-Hoc)
        run: |
          cd apps/mobile/ios
          set -o pipefail
          xcodebuild -workspace AIICClub.xcworkspace \
            -scheme AIICClub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            ONLY_ACTIVE_ARCH=NO 2>&1 | tee xcodebuild.log

      - name: 📦 Package App Bundle into .ipa
        run: |
          cd apps/mobile/ios
          mkdir -p Payload
          # Search for the built .app bundle in the derivedData output
          APP_DIR=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find build -name "*.app" | head -n 1)
          fi
          
          echo "Found app bundle: $APP_DIR"
          if [ -d "$APP_DIR" ]; then
            cp -r "$APP_DIR" Payload/
            zip -r AIICClub-release.ipa Payload
            ls -lh AIICClub-release.ipa
            rm -rf Payload
          else
            echo "❌ Error: App bundle not found in build directory"
            find build -maxdepth 4 -ls
            exit 1
          fi

      - name: 🔍 Print Failure Diagnostics
        if: failure()
        run: |
          echo "==================== BUILD FAILURE DETECTED ===================="
          if [ -f apps/mobile/ios/xcodebuild.log ]; then
            echo "--- Extracting Fatal Errors and Compilation Failures ---"
            grep -E -C 4 "error:|fatal error:|BUILD FAILED|Signing for|Code signing" apps/mobile/ios/xcodebuild.log | tail -n 60 || true
            echo "--- Last 50 lines of xcodebuild log ---"
            tail -n 50 apps/mobile/ios/xcodebuild.log
          fi
          echo "================================================================"

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiic-club-release-ipa
          path: apps/mobile/ios/AIICClub-release.ipa
          if-no-files-found: error
