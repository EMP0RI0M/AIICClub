name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 📂 Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: 🛠️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🚀 Expo Prebuild (Generate Native Android Project)
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: "https://aiic-bbs.vercel.app/api"
          EXPO_PUBLIC_SUPABASE_URL: "https://tgbjgyhcfhqvwayvvwkl.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnYmpneWhjZmhxdndheXZ2d2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTcwNjIsImV4cCI6MjEwMjI5MzA2Mn0.Cjj6oY9s7FwTywXlw-9h4Um01cBvfllKQqapobmYXNY"

      - name: 🔨 Build Android Release APK with Gradle
        run: |
          cd apps/mobile/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_API_URL: "https://aiic-bbs.vercel.app/api"
          EXPO_PUBLIC_SUPABASE_URL: "https://tgbjgyhcfhqvwayvvwkl.supabase.co"
          EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnYmpneWhjZmhxdndheXZ2d2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTcwNjIsImV4cCI6MjEwMjI5MzA2Mn0.Cjj6oY9s7FwTywXlw-9h4Um01cBvfllKQqapobmYXNY"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiic-club-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
